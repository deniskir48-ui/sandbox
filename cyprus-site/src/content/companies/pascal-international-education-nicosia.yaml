description: "Кампус в Лакатамии (Никосия). Сеть PASCAL International Education (с 1978 года, входит в Globeducate) предлагает детский сад, начальную школу по программе Cambridge Primary, среднюю школу с подготовкой к IGCSE, GCE A Levels и IB Diploma, а также кипрский аттестат Apolytirion; конкретные программы кампуса уточняйте у школы. В реестре Министерства образования Кипра в Никосии значатся английские начальная и средняя школы PASCAL и греческая средняя школа."
