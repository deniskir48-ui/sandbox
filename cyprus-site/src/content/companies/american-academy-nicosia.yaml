description: "Частная школа в Никосии, по данным школы основана более 100 лет назад. Дошкольная группа и детский сад, начальная и средняя школа по английской программе (English Curriculum), выпускники получают кипрский аттестат Apolytirion. В реестре Министерства образования Кипра значится как начальная и средняя школа с обучением на английском."
