description: "Образовательный центр для взрослых на кампусе Lumio Private School в Пафосе. В расписании интенсивный курс «Greek A2: Mission Possible» для русскоязычных с подготовкой к государственному экзамену A2, курс B1, греческий для начинающих в англоязычных группах и разговорный клуб для уровня B1. Группы по 6–8 человек, при записи приоритет у семей учеников школы."
