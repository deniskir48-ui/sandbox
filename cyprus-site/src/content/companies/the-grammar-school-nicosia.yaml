summary: "The Grammar School Nicosia: семилетняя средняя школа на английском с IGCSE, A Level и кипрским аттестатом."
description: "Частная средняя школа в Никосии, кампус в Пано Дефтера (с 1981 года). Семилетняя программа на английском языке ведёт к экзаменам IGCSE, GCE AS и A Level и школьному аттестату Apolytirion; при поступлении в 1-й класс сдаются вступительные экзамены. Школа — экзаменационный центр GCE. В реестре Министерства образования Кипра значится также младшая школа The Grammar Junior School."
