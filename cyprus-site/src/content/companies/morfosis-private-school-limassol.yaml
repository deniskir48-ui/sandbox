description: "Русскоязычная общеобразовательная школа с углублённым изучением английского и греческого языков. По данным школы, обучение ведётся по программам Министерства образования и науки Российской Федерации и Республики Кипр. Старшая школа — Dimitri Liperti 12, Лимассол, младшая — Kozanis 30, Колосси. В реестре Министерства образования Кипра лимассольские начальная и средняя школы значатся с языком обучения русский. Ещё одна школа сети работает в Пафосе."
