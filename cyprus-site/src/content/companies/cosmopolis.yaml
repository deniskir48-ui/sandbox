description: "Языковой центр в центре Никосии, работает с 2010 года. Преподаёт взрослым греческий, английский, русский, турецкий и французский. По греческому есть групповые курсы от A1 до C1, разговорный клуб и кипрский диалект для уровня от B1, частные уроки. На сайте расписано, как подготовиться к государственному экзамену A2: три групповых курса (A1, A2.1, A2.2) или частные занятия. Для Ларнаки, Лимассола и Пафоса есть онлайн-курсы."
