description: "Gloria Motors Services Ltd из Ларнаки заказывает автомобили из Японии на Кипр с гарантией, продаёт машины в наличии, помогает с кредитом и предлагает lease-to-buy (аренду с выкупом). Бесплатно консультирует при покупке машины на Кипре, расшифровывает аукционные листы японских автомобилей, проводит диагностику. В собственном сервисе — техобслуживание, ремонт, перетяжка салона и покраска. Консультации по телефону на греческом, английском, русском и украинском. Японские аукционы и машины в наличии компания также показывает на новом сайте buycarincyprus.cy."
