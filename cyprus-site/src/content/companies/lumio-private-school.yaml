description: "Частная международная школа в Ахелии (Пафос). Детский сад, начальная школа по программе Cambridge Primary, средняя школа по программам International Baccalaureate (MYP и Diploma Programme), упор на STEAM-предметы. В реестре Министерства образования Кипра значится как начальная и средняя школа с обучением на английском. При школе работает центр курсов для взрослых Lumio Edu Centre."
