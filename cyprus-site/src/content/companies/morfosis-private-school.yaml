description: "Русскоязычная общеобразовательная школа с углублённым изучением английского и греческого языков. По данным школы, обучение ведётся по программам Министерства образования и науки Российской Федерации и Республики Кипр; в Лимассоле работают младшая и старшая школы, ещё одна школа — в Пафосе. В реестре Министерства образования Кипра лимассольские начальная и средняя школы значатся с языком обучения русский."
