description: "MIZUHO MEDTRADE LTD — кипрско-японская компания из Лимассола. Привозит из Японии подержанные автомобили, в основном праворульные, в том числе европейские модели, JDM, спортивные и классические машины; большинство — младше трёх лет с пробегом до 30 000 км. Можно выбрать машину из каталога по схеме «всё включено» (перевозка, пошлина и НДС в цене) или заказать поиск автомобиля под свой запрос и бюджет. Перед продажей машину осматривают, на время перевозки она застрахована; если при передаче обнаружится серьёзный скрытый дефект, компания обещает вернуть деньги. Сайт на английском."
