summary: "Открытие 21 ноября: в 16:30 аквагрим и ростовые персонажи; в 17:30 зажжение огней и живая джазовая музыка. Местные часы и программа уточняются."
hours: "По выходным с 21 ноября по 20 декабря, в пятницы 11 и 18 декабря и каждый день с 21 декабря по 6 января. Часы и программа по дням — в программе деревни"
description: "Агрос — деревня в Троодосе (район Пицилия) на высоте около 1100 м, известная розами, мясными деликатесами (луканика, хиромери), домашними джемами и сладостями. В местных мастерских показывают перегонку розовой воды, приготовление сладостей и мясных деликатесов. Входит в программу рождественских деревень Кипра."
