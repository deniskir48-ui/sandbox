# Скопируйте в config.yaml и настройте под свой канал.

channel:
  niche: "Fitness, sports, nutrition and healthy lifestyle: workouts, fat loss, muscle gain, healthy eating, sleep, recovery, myths vs science"
  audience: "English-speaking people 18-40 who want to get fitter, eat better and feel more energetic, mostly beginners and intermediates"
  language: "en"          # код языка (en, ru, es...) - так требует YouTube
  tone: "Energetic, motivating, friendly coach; simple words, practical takeaways, myth-busting with science; no fat-shaming"
  video_length_seconds: 40
  extra_rules:
    - "Only evidence-based claims that match current scientific consensus; never invent studies or numbers"
    - "No medical diagnoses, no promises to cure or treat diseases, no extreme diets or fasting advice"
    - "No specific supplement or medication dosages; for supplements say 'talk to a doctor'"
    - "No body-shaming or content that could trigger eating disorders; no 'lose 10 kg in a week' style promises"
    - "Every video must give one practical tip the viewer can apply today"
    - "End with a question to the viewer to drive comments"
    - "Do not mention brands"
  disclaimer: "This video is for educational purposes only and is not medical advice. Consult a professional before changing your diet or training."

llm:
  model: claude-opus-5-5
  web_research: true      # агент ищет свежие инфоповоды в интернете
  max_revisions: 2        # сколько раз редактор может вернуть сценарий
  min_score: 8            # минимальная оценка редактора для запуска в производство

voice:
  provider: edge          # edge (бесплатно) | elevenlabs (платно, естественнее)
  voice: en-US-AndrewMultilingualNeural   # edge: en-US-AndrewMultilingualNeural, en-US-AvaMultilingualNeural, en-US-ChristopherNeural; elevenlabs: voice_id
  rate: "+5%"

footage:
  provider: pexels        # pexels | none (цветной фон, удобно для теста)

subtitles:
  font: "Arial"           # или свой .ttf: положите его в assets/fonts и укажите название шрифта
  font_size: 86
  color: "#FFFFFF"
  highlight_color: "#FFD700"
  max_words: 3
  uppercase: true

video:
  music_dir: assets/music # фоновые треки (mp3/m4a); берётся случайный. Только музыка с правом использования!
  music_volume: 0.12

publish:
  auto_publish: false     # false = ролик ждёт вашей проверки и команды publish
  platforms: [youtube, instagram, tiktok]
  ai_disclosure: true     # пометка «создано с ИИ» на YouTube и TikTok
  youtube:
    privacy: private      # public | unlisted | private
    category_id: "26"     # 26 = Howto & Style, 17 = Sports, 27 = Education
  instagram:
    graph_host: graph.instagram.com   # graph.facebook.com, если используете вход через Facebook
    share_to_feed: true
  tiktok:
    mode: direct          # direct = сразу публикует; inbox = кладёт в черновики приложения TikTok
    privacy_level: PUBLIC_TO_EVERYONE # до аудита приложения TikTok разрешает только SELF_ONLY

workspace: workspace
